# Her push'ta MetaClean'i Windows, macOS (Apple Silicon) ve Linux'ta test eder ve paketler.
# Paketler Actions sayfasındaki "Artifacts" bölümünden indirilir; v* etiketi atılırsa sürüm (Release) açılır.
name: Derle ve paketle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# En az yetki: derleme işleri yalnızca okur; yazma yetkisi yalnızca sürümü yayımlayan adımda
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: MetaClean-Windows-x64
          - os: macos-14
            name: MetaClean-macOS-AppleSilicon
          - os: ubuntu-24.04
            name: MetaClean-Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # Takılan bir adım 6 saat beklemesin
    env:
      PYTHONUTF8: "1"  # Windows konsolu Türkçe çıktıyı bozmasın
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Testlerin örnek dosya üretmesi için kodlayıcılı tam FFmpeg ve ExifTool (yalnızca testte kullanılır)
      - name: Test araçları (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl libegl1 libxkbcommon0 libxcb-cursor0
      - name: Test araçları (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Test araçları (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress ffmpeg-full exiftool

      - name: Python kütüphaneleri
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Testler
        run: python -m unittest discover -s tests -v

      - name: Pakete girecek ExifTool ve FFmpeg
        run: python packaging/fetch_tools.py

      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/metaclean.spec

      # Paketin kendi araçlarıyla, sistemdekilere bakmadan çalıştığını kanıtla
      - name: Paket sınaması
        timeout-minutes: 5
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/MetaClean/MetaClean.exe --selftest
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/MetaClean.app/Contents/MacOS/MetaClean --selftest
          else
            QT_QPA_PLATFORM=offscreen ./dist/MetaClean/MetaClean --selftest
          fi
          code=$?
          cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/metaclean-selftest.txt"
          exit $code

      - name: Arşivle
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "out/${{ matrix.name }}.zip" ./dist/MetaClean
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Tek dosya: açılınca "Uygulamalar'a sürükle" penceresi çıkan sıkıştırılmış DMG
            mkdir -p dmg && ditto dist/MetaClean.app dmg/MetaClean.app && ln -s /Applications dmg/Uygulamalar
            hdiutil create -volname MetaClean -srcfolder dmg -fs HFS+ -format UDZO -imagekey zlib-level=9 \
              -ov "out/${{ matrix.name }}.dmg"
          else
            cp packaging/linux/metaclean.desktop packaging/linux/install_bundle.sh dist/MetaClean/
            cp metaclean/gui/assets/logo-512.png dist/MetaClean/metaclean.png
            tar -C dist -czf "out/${{ matrix.name }}.tar.gz" MetaClean
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: out
          merge-multiple: true
      # Paketler imzasız; kullanıcı indirdiği dosyanın değiştirilmediğini bu özetlerle doğrulayabilir
      - name: SHA-256 özetleri
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: out/*
