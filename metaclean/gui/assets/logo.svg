<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd18f"/>
      <stop offset="1" stop-color="#0b7a63"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbf3"/>
      <stop offset="1" stop-color="#c9f1e0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25b783"/>
      <stop offset="1" stop-color="#0e8a6c"/>
    </linearGradient>
    <clipPath id="photo"><rect x="222" y="292" width="520" height="420" rx="56"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04382d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- zemin -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- fotoğraf kartı -->
  <g filter="url(#shadow)">
    <rect x="198" y="268" width="568" height="468" rx="76" fill="#ffffff"/>
  </g>
  <g clip-path="url(#photo)">
    <rect x="222" y="292" width="520" height="420" fill="url(#sky)"/>
    <circle cx="610" cy="410" r="52" fill="#ffd166"/>
    <path d="M222 640 L380 470 L480 575 L560 505 L742 680 L742 712 L222 712 Z" fill="url(#hill)"/>
  </g>
  <!-- temizlik parıltısı -->
  <g transform="translate(748 286)">
    <path d="M0 -150 C 18 -48 48 -18 150 0 C 48 18 18 48 0 150 C -18 48 -48 18 -150 0 C -48 -18 -18 -48 0 -150 Z"
          fill="#ffffff" stroke="#0b7a63" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g transform="translate(860 470)">
    <path d="M0 -58 C 7 -18 18 -7 58 0 C 18 7 7 18 0 58 C -7 18 -18 7 -58 0 C -18 -7 -7 -18 0 -58 Z" fill="#ffffff"/>
  </g>
</svg>
